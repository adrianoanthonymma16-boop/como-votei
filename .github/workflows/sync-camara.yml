name: Sync Câmara dos Deputados

on:
  schedule:
    # Diário às 03:00 UTC (00:00 BRT)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano para sincronizar (padrão: ano atual)'
        required: false
        type: string
      apenas-parlamentares:
        description: 'Sincronizar apenas parlamentares'
        required: false
        type: boolean
      apenas-votacoes:
        description: 'Sincronizar apenas votações'
        required: false
        type: boolean
      apenas-discursos:
        description: 'Sincronizar apenas discursos'
        required: false
        type: boolean
      apenas-proposicoes:
        description: 'Sincronizar apenas proposições'
        required: false
        type: boolean
      apenas-frequencia:
        description: 'Sincronizar apenas frequência'
        required: false
        type: boolean

jobs:
  sync-camara:
    name: Sync Câmara
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      CAMARA_API_BASE: ${{ vars.CAMARA_API_BASE }}
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      # Agendado (sem inputs): cobre 3 anos (MVP) em loop para garantir
      # que 2024/2025/2026 estejam sempre completos. Cada fase roda separada
      # para evitar rate-limit entre discursos/proposições no mesmo processo.
      - name: Sync base (partidos + parlamentares)
        if: github.event_name == 'schedule'
        run: npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-camara.ts --apenas-parlamentares

      - name: Sync votações (3 anos)
        if: github.event_name == 'schedule'
        run: |
          for ano in 2024 2025 2026; do
            echo "🗳️  Sync votações $ano"
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-camara.ts --apenas-votacoes --ano=$ano
          done

      - name: Sync discursos (3 anos)
        if: github.event_name == 'schedule'
        run: |
          for ano in 2024 2025 2026; do
            echo "🎤 Sync discursos $ano"
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-camara.ts --apenas-discursos --ano=$ano
          done

      - name: Sync proposições (3 anos)
        if: github.event_name == 'schedule'
        run: |
          for ano in 2024 2025 2026; do
            echo "📋 Sync proposições $ano"
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-camara.ts --apenas-proposicoes --ano=$ano
          done

      - name: Sync frequência (3 anos)
        if: github.event_name == 'schedule'
        run: |
          for ano in 2024 2025 2026; do
            echo "📅 Sync frequência $ano"
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-camara.ts --apenas-frequencia --ano=$ano
          done

      - name: Guardrail — nominais sem votos
        if: github.event_name == 'schedule'
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          p.\$queryRaw\`SELECT COUNT(*)::int as cnt FROM votacoes v LEFT JOIN votos vo ON vo.votacao_id = v.id WHERE v.casa='CAMARA' AND v.descricao ILIKE '%Sim:%' GROUP BY v.id HAVING COUNT(vo.id)=0\`.then(r=>{ const c=r.length; console.log('Nominais órfãs:',c); if(c>15){console.error('❌ Muitas nominais sem votos — sync incompleto'); process.exit(1)} else console.log('✅ Guardrail OK'); p.\$disconnect() })
          "

      # Execução manual: respeita os inputs escolhidos (uma única invocação).
      - name: Sync Câmara (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-camara.ts \
            ${{ github.event.inputs.ano && format('--ano={0}', github.event.inputs.ano) || '' }} \
            ${{ github.event.inputs.apenas-parlamentares && '--apenas-parlamentares' || '' }} \
            ${{ github.event.inputs.apenas-votacoes && '--apenas-votacoes' || '' }} \
            ${{ github.event.inputs.apenas-discursos && '--apenas-discursos' || '' }} \
            ${{ github.event.inputs.apenas-proposicoes && '--apenas-proposicoes' || '' }} \
            ${{ github.event.inputs.apenas-frequencia && '--apenas-frequencia' || '' }}

      - name: Log completion
        if: always()
        run: |
          echo "✅ Sync Câmara concluído em $(date)"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"

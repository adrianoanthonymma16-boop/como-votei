name: Sync Câmara dos Deputados

permissions:
  contents: read

# Evita que um run agendado e um manual disputem o mesmo banco/API ao mesmo tempo.
concurrency:
  group: sync-camara
  cancel-in-progress: false

on:
  schedule:
    # Diário às 03:00 UTC (00:00 BRT)
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano para sincronizar (padrão: ano atual)'
        required: false
        type: string
      apenas-parlamentares:
        description: 'Sincronizar apenas parlamentares'
        required: false
        type: boolean
      apenas-votacoes:
        description: 'Sincronizar apenas votações'
        required: false
        type: boolean
      apenas-discursos:
        description: 'Sincronizar apenas discursos'
        required: false
        type: boolean
      apenas-proposicoes:
        description: 'Sincronizar apenas proposições'
        required: false
        type: boolean
      apenas-frequencia:
        description: 'Sincronizar apenas frequência'
        required: false
        type: boolean
      apenas-despesas:
        description: 'Sincronizar apenas despesas (CEAP)'
        required: false
        type: boolean
      bulk:
        description: 'Usar arquivos JSON em lote para votações/proposições (recomendado)'
        required: false
        type: boolean
        default: true
      offset:
        description: 'Índice inicial de deputados (retomada por faixa; só fases por deputado)'
        required: false
        type: string
      limite:
        description: 'Quantidade de deputados a processar a partir do offset'
        required: false
        type: string

env:
  # Timeouts estendidos: o Neon free tier suspende o compute parado e a
  # primeira conexão (cold start) estoura o pool_timeout padrão (P1002).
  DATABASE_URL: ${{ secrets.DATABASE_URL }}&connect_timeout=30&pool_timeout=60
  CAMARA_API_BASE: ${{ vars.CAMARA_API_BASE }}
  # Sem NODE_ENV=production: com ele, `npm ci` omite devDependencies
  # (ts-node/typescript) e o `npx ts-node` baixa cópia avulsa que quebra.

jobs:
  # Referência (partidos + deputados) precisa existir antes das demais fases.
  base:
    name: Base (partidos + parlamentares)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run migrations
        # Retry: primeira conexão após idle do Neon pode dar P1002 (cold start).
        run: |
          for tentativa in 1 2 3 4 5; do
            npx prisma migrate deploy && break
            echo "migrate falhou (tentativa $tentativa/5) — retry em 30s..."
            [ "$tentativa" = 5 ] && exit 1
            sleep 30
          done
      - name: Sync base (partidos + parlamentares)
        # Retry: a API da Câmara devolve 504 transitório; sem retry, uma
        # indisponibilidade momentânea derruba o job inteiro.
        run: |
          for tentativa in 1 2 3; do
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-camara.ts --apenas-parlamentares && break
            echo "sync base falhou (tentativa $tentativa/3) — retry em 60s..."
            [ "$tentativa" = 3 ] && exit 1
            sleep 60
          done

  # Cada fase roda em um job próprio (matrix): teto de 6h individual, então
  # uma fase lenta ou que falha não impede as outras de rodar. `--bulk` troca
  # 1 request por item pelos arquivos JSON oficiais publicados por ano.
  fases:
    name: Fase ${{ matrix.nome }}
    needs: base
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - nome: votações
            args: --apenas-votacoes --bulk
          - nome: discursos
            args: --apenas-discursos
          - nome: proposições
            args: --apenas-proposicoes --bulk
          - nome: frequência
            args: --apenas-frequencia
    env:
      # Args vêm de constantes do próprio YAML (nunca de input do usuário),
      # então não há interpolação de valor não confiável no `run`.
      FASE_ARGS: ${{ matrix.args }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run migrations
        run: |
          for tentativa in 1 2 3 4 5; do
            npx prisma migrate deploy && break
            echo "migrate falhou (tentativa $tentativa/5) — retry em 30s..."
            [ "$tentativa" = 5 ] && exit 1
            sleep 30
          done
      - name: Sync ${{ matrix.nome }} (3 anos)
        # Retry por ano: 5xx/reset transitório da fonte não pode derrubar a
        # fase — os upserts são idempotentes, então repetir é seguro.
        run: |
          for ano in $(npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/anos-janela.ts); do
            echo "▶️  ${{ matrix.nome }} $ano"
            for tentativa in 1 2 3; do
              # shellcheck disable=SC2086
              npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-camara.ts $FASE_ARGS --ano=$ano && break
              echo "fase ${{ matrix.nome }} $ano falhou (tentativa $tentativa/3) — retry em 60s..."
              [ "$tentativa" = 3 ] && exit 1
              sleep 60
            done
          done

  # Despesas usa um script dedicado (CEAP), por isso não entra na matrix acima.
  despesas:
    name: Fase despesas (CEAP)
    needs: base
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run migrations
        run: |
          for tentativa in 1 2 3 4 5; do
            npx prisma migrate deploy && break
            echo "migrate falhou (tentativa $tentativa/5) — retry em 30s..."
            [ "$tentativa" = 5 ] && exit 1
            sleep 30
          done
      - name: Sync despesas CEAP (3 anos)
        run: |
          for tentativa in 1 2 3; do
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-despesas-camara.ts --apenas-despesas && break
            echo "sync despesas falhou (tentativa $tentativa/3) — retry em 60s..."
            [ "$tentativa" = 3 ] && exit 1
            sleep 60
          done

  # Guardrails e retenção só depois de todas as fases tentarem rodar.
  guardrails:
    name: Guardrails
    needs: [fases, despesas]
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Guardrail — nominais sem votos
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          p.\$queryRaw\`SELECT COUNT(*)::int as cnt FROM votacoes v LEFT JOIN votos vo ON vo.votacao_id = v.id WHERE v.casa='CAMARA' AND v.descricao ILIKE '%Sim:%' GROUP BY v.id HAVING COUNT(vo.id)=0\`.then(r=>{ const c=r.length; console.log('Nominais órfãs:',c); if(c>15){console.error('❌ Muitas nominais sem votos — sync incompleto'); process.exit(1)} else console.log('✅ Guardrail OK'); p.\$disconnect() })
          "
      - name: Guardrail — proposições e tramitações da Câmara
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          (async () => {
            const total = await p.proposicao.count({ where: { casa: 'CAMARA' } });
            console.log('Proposições CAMARA:', total);
            if (total === 0) { console.error('❌ Nenhuma proposição da Câmara — sync de autorias quebrou'); process.exit(1); }
            const semStatus = await p.proposicao.count({ where: { casa: 'CAMARA', status: 'APRESENTADA' } });
            const pct = total > 0 ? (semStatus / total) * 100 : 0;
            console.log('APRESENTADA (sem enriquecimento):', semStatus, pct.toFixed(1) + '%');
            if (pct > 95) { console.error('❌ Enriquecimento de status da Câmara falhou (>95% APRESENTADA)'); process.exit(1); }
            const trams = await p.tramitacao.count({ where: { proposicao: { casa: 'CAMARA' } } });
            console.log('Tramitações CAMARA:', trams);
            if (trams === 0) { console.error('❌ Nenhuma tramitação da Câmara — sync de tramitações quebrou'); process.exit(1); }
            console.log('✅ Guardrail proposições OK');
            await p.\$disconnect();
          })().catch(e => { console.error(e); process.exit(1); });
          "

  retencao:
    name: Coleta de lixo (retenção 3 anos)
    needs: guardrails
    if: always() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run migrations
        run: npx prisma migrate deploy
      # Remove registros fora da janela de 3 anos (ver src/lib/gc.ts).
      - name: Coleta de lixo
        run: npm run gc:apply

  # Execução manual: respeita os inputs escolhidos (uma única invocação).
  # Monta os args em bash comparando com "true": inputs booleanos vindos
  # da API chegam como string "false" (truthy em ${{ }}), o que ligava
  # todas as fases sem querer.
  manual:
    name: Sync Câmara (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apenas-despesas != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run migrations
        run: |
          for tentativa in 1 2 3 4 5; do
            npx prisma migrate deploy && break
            echo "migrate falhou (tentativa $tentativa/5) — retry em 30s..."
            [ "$tentativa" = 5 ] && exit 1
            sleep 30
          done
      - name: Sync Câmara (manual)
        env:
          INPUT_ANO: ${{ github.event.inputs.ano }}
          INPUT_PARLAMENTARES: ${{ github.event.inputs.apenas-parlamentares }}
          INPUT_VOTACOES: ${{ github.event.inputs.apenas-votacoes }}
          INPUT_DISCURSOS: ${{ github.event.inputs.apenas-discursos }}
          INPUT_PROPOSICOES: ${{ github.event.inputs.apenas-proposicoes }}
          INPUT_FREQUENCIA: ${{ github.event.inputs.apenas-frequencia }}
          INPUT_BULK: ${{ github.event.inputs.bulk }}
          INPUT_OFFSET: ${{ github.event.inputs.offset }}
          INPUT_LIMITE: ${{ github.event.inputs.limite }}
        run: |
          ARGS=""
          [ -n "$INPUT_ANO" ] && ARGS="$ARGS --ano=$INPUT_ANO"
          [ "$INPUT_PARLAMENTARES" = "true" ] && ARGS="$ARGS --apenas-parlamentares"
          [ "$INPUT_VOTACOES" = "true" ] && ARGS="$ARGS --apenas-votacoes"
          [ "$INPUT_DISCURSOS" = "true" ] && ARGS="$ARGS --apenas-discursos"
          [ "$INPUT_PROPOSICOES" = "true" ] && ARGS="$ARGS --apenas-proposicoes"
          [ "$INPUT_FREQUENCIA" = "true" ] && ARGS="$ARGS --apenas-frequencia"
          [ "$INPUT_BULK" = "true" ] && ARGS="$ARGS --bulk"
          [ -n "$INPUT_OFFSET" ] && ARGS="$ARGS --offset=$INPUT_OFFSET"
          [ -n "$INPUT_LIMITE" ] && ARGS="$ARGS --limite=$INPUT_LIMITE"
          echo "Args: '${ARGS:-<full sync>}'"
          # Retry (upserts são idempotentes): protege de P1002 transitório.
          # shellcheck disable=SC2086
          for tentativa in 1 2 3; do
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-camara.ts $ARGS && break
            echo "sync falhou (tentativa $tentativa/3) — retry em 60s..."
              [ "$tentativa" = 3 ] && exit 1
              sleep 60
            done

  despesas-manual:
    name: Sync despesas CEAP (manual)
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.apenas-despesas == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Run migrations
        run: npx prisma migrate deploy
      - name: Sync despesas CEAP (manual)
        env:
          INPUT_ANO: ${{ github.event.inputs.ano }}
        run: |
          ARGS=""
          [ -n "$INPUT_ANO" ] && ARGS="--ano=$INPUT_ANO"
          for tentativa in 1 2 3; do
            # shellcheck disable=SC2086
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-despesas-camara.ts --apenas-despesas $ARGS && break
            echo "sync despesas falhou (tentativa $tentativa/3) — retry em 60s..."
            [ "$tentativa" = 3 ] && exit 1
            sleep 60
          done

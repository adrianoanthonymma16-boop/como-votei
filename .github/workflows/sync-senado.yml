name: Sync Senado Federal

on:
  schedule:
    # Diário às 04:00 UTC (01:00 BRT) - após Câmara
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano para sincronizar (padrão: ano atual)'
        required: false
        type: string
      apenas-parlamentares:
        description: 'Sincronizar apenas parlamentares'
        required: false
        type: boolean
      apenas-votacoes:
        description: 'Sincronizar apenas votações'
        required: false
        type: boolean
      apenas-discursos:
        description: 'Sincronizar apenas discursos'
        required: false
        type: boolean
      apenas-frequencia:
        description: 'Sincronizar apenas frequência'
        required: false
        type: boolean

jobs:
  sync-senado:
    name: Sync Senado
    runs-on: ubuntu-latest
    timeout-minutes: 120
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      NODE_ENV: production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        run: npx prisma migrate deploy

      - name: Sync Senado Federal (schedule — 3 anos)
        if: github.event_name == 'schedule'
        run: |
          for ano in 2024 2025 2026; do
            echo "🏛️  Sync Senado $ano"
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-senado.ts --ano=$ano
          done

      - name: Sync Senado Federal (manual)
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-senado.ts \
            ${{
              format('
                {0}
                {1}
                {2}
                {3}
                {4}
              ', 
                github.event.inputs.ano && `--ano=${github.event.inputs.ano}` || '',
                github.event.inputs.apenas-parlamentares && '--apenas-parlamentares' || '',
                github.event.inputs.apenas-votacoes && '--apenas-votacoes' || '',
                github.event.inputs.apenas-discursos && '--apenas-discursos' || '',
                github.event.inputs.apenas-frequencia && '--apenas-frequencia' || ''
              )
            }}

      - name: Log completion
        if: always()
        run: |
          echo "✅ Sync Senado concluído em $(date)"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"
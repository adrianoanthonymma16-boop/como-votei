name: Sync Senado Federal

permissions:
  contents: read

# Evita que um run agendado e um manual disputem o mesmo banco/API ao mesmo tempo.
concurrency:
  group: sync-senado
  cancel-in-progress: false

on:
  schedule:
    # Diário às 04:00 UTC (01:00 BRT) - após Câmara
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      ano:
        description: 'Ano para sincronizar (padrão: ano atual)'
        required: false
        type: string
      apenas-parlamentares:
        description: 'Sincronizar apenas parlamentares'
        required: false
        type: boolean
      apenas-votacoes:
        description: 'Sincronizar apenas votações'
        required: false
        type: boolean
      apenas-discursos:
        description: 'Sincronizar apenas discursos'
        required: false
        type: boolean
      apenas-proposicoes:
        description: 'Sincronizar apenas proposições (autorias + situação + tramitações)'
        required: false
        type: boolean
      apenas-frequencia:
        description: 'Sincronizar apenas frequência'
        required: false
        type: boolean
      apenas-despesas:
        description: 'Sincronizar apenas despesas (CEAPS)'
        required: false
        type: boolean
      offset:
        description: 'Índice inicial de senadores (retomada por faixa)'
        required: false
        type: string
      limite:
        description: 'Quantidade de senadores a processar a partir do offset'
        required: false
        type: string

jobs:
  sync-senado:
    name: Sync Senado
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      # Timeouts estendidos: o Neon free tier suspende o compute parado e a
      # primeira conexão (cold start) estoura o pool_timeout padrão (P1002).
      DATABASE_URL: ${{ secrets.DATABASE_URL }}&connect_timeout=30&pool_timeout=60
      # Sem NODE_ENV=production: com ele, `npm ci` omite devDependencies
      # (ts-node/typescript) e o `npx ts-node` baixa cópia avulsa que quebra.

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run migrations
        # Retry: primeira conexão após idle do Neon pode dar P1002 (cold start).
        run: |
          for tentativa in 1 2 3 4 5; do
            npx prisma migrate deploy && break
            echo "migrate falhou (tentativa $tentativa/5) — retry em 30s..."
            [ "$tentativa" = 5 ] && exit 1
            sleep 30
          done

      # Agendado (sem inputs): cobre 3 anos (MVP) em fases separadas para
      # respeitar o rate limit do Senado (10 req/s) e isolar falhas por fase.
      - name: Sync base (senadores)
        if: github.event_name == 'schedule'
        # Retry: estabilidade da API do Senado; upserts são idempotentes.
        run: |
          for tentativa in 1 2 3; do
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-senado.ts --apenas-parlamentares && break
            echo "sync base falhou (tentativa $tentativa/3) — retry em 60s..."
            [ "$tentativa" = 3 ] && exit 1
            sleep 60
          done

      - name: Sync votações (3 anos)
        if: github.event_name == 'schedule'
        # Retry por ano: 503/reset transitório da fonte não pode derrubar a
        # fase — os upserts são idempotentes, então repetir é seguro.
        run: |
          for ano in $(npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/anos-janela.ts); do
            echo "🗳️  Sync votações $ano"
            for tentativa in 1 2 3; do
              npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-senado.ts --apenas-votacoes --ano="$ano" && break
              echo "sync votações $ano falhou (tentativa $tentativa/3) — retry em 60s..."
              [ "$tentativa" = 3 ] && exit 1
              sleep 60
            done
          done

      - name: Sync discursos (3 anos)
        if: github.event_name == 'schedule'
        run: |
          for ano in $(npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/anos-janela.ts); do
            echo "🎤 Sync discursos $ano"
            for tentativa in 1 2 3; do
              npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-senado.ts --apenas-discursos --ano="$ano" && break
              echo "sync discursos $ano falhou (tentativa $tentativa/3) — retry em 60s..."
              [ "$tentativa" = 3 ] && exit 1
              sleep 60
            done
          done

      - name: Sync proposições (3 anos)
        if: github.event_name == 'schedule'
        run: |
          for ano in $(npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/anos-janela.ts); do
            echo "📋 Sync proposições $ano"
            for tentativa in 1 2 3; do
              npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-senado.ts --apenas-proposicoes --ano="$ano" && break
              echo "sync proposições $ano falhou (tentativa $tentativa/3) — retry em 60s..."
              [ "$tentativa" = 3 ] && exit 1
              sleep 60
            done
          done

      - name: Sync frequência (3 anos)
        if: github.event_name == 'schedule'
        run: |
          for ano in $(npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/anos-janela.ts); do
            echo "📅 Sync frequência $ano"
            for tentativa in 1 2 3; do
              npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-senado.ts --apenas-frequencia --ano="$ano" && break
              echo "sync frequência $ano falhou (tentativa $tentativa/3) — retry em 60s..."
              [ "$tentativa" = 3 ] && exit 1
              sleep 60
            done
          done

      - name: Sync despesas CEAPS (3 anos)
        if: github.event_name == 'schedule'
        run: |
          for tentativa in 1 2 3; do
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-despesas-senado.ts --apenas-despesas && break
            echo "sync despesas falhou (tentativa $tentativa/3) — retry em 60s..."
            [ "$tentativa" = 3 ] && exit 1
            sleep 60
          done

      - name: Guardrail — proposições e tramitações do Senado
        if: github.event_name == 'schedule'
        run: |
          node -e "
          const { PrismaClient } = require('@prisma/client');
          const p = new PrismaClient();
          (async () => {
            const total = await p.proposicao.count({ where: { casa: 'SENADO' } });
            console.log('Proposições SENADO:', total);
            if (total === 0) { console.error('❌ Nenhuma proposição do Senado — sync de autorias quebrou'); process.exit(1); }
            const semStatus = await p.proposicao.count({ where: { casa: 'SENADO', status: 'APRESENTADA' } });
            const pct = total > 0 ? (semStatus / total) * 100 : 0;
            console.log('APRESENTADA (sem enriquecimento):', semStatus, pct.toFixed(1) + '%');
            if (pct > 95) { console.error('❌ Enriquecimento de situação do Senado falhou (>95% APRESENTADA)'); process.exit(1); }
            const trams = await p.tramitacao.count({ where: { proposicao: { casa: 'SENADO' } } });
            console.log('Tramitações SENADO:', trams);
            if (trams === 0) { console.error('❌ Nenhuma tramitação do Senado — sync de movimentações quebrou'); process.exit(1); }
            console.log('✅ Guardrail Senado OK');
            await p.\$disconnect();
          })().catch(e => { console.error(e); process.exit(1); });
          "

      # Execução manual: respeita os inputs escolhidos (uma única invocação).
      - name: Sync Senado Federal (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apenas-despesas != 'true'
        env:
          INPUT_ANO: ${{ github.event.inputs.ano }}
          INPUT_PARLAMENTARES: ${{ github.event.inputs.apenas-parlamentares }}
          INPUT_VOTACOES: ${{ github.event.inputs.apenas-votacoes }}
          INPUT_DISCURSOS: ${{ github.event.inputs.apenas-discursos }}
          INPUT_PROPOSICOES: ${{ github.event.inputs.apenas-proposicoes }}
          INPUT_FREQUENCIA: ${{ github.event.inputs.apenas-frequencia }}
          INPUT_OFFSET: ${{ github.event.inputs.offset }}
          INPUT_LIMITE: ${{ github.event.inputs.limite }}
        run: |
          ARGS=""
          [ -n "$INPUT_ANO" ] && ARGS="$ARGS --ano=$INPUT_ANO"
          [ "$INPUT_PARLAMENTARES" = "true" ] && ARGS="$ARGS --apenas-parlamentares"
          [ "$INPUT_VOTACOES" = "true" ] && ARGS="$ARGS --apenas-votacoes"
          [ "$INPUT_DISCURSOS" = "true" ] && ARGS="$ARGS --apenas-discursos"
          [ "$INPUT_PROPOSICOES" = "true" ] && ARGS="$ARGS --apenas-proposicoes"
          [ "$INPUT_FREQUENCIA" = "true" ] && ARGS="$ARGS --apenas-frequencia"
          [ -n "$INPUT_OFFSET" ] && ARGS="$ARGS --offset=$INPUT_OFFSET"
          [ -n "$INPUT_LIMITE" ] && ARGS="$ARGS --limite=$INPUT_LIMITE"
          echo "Args: '${ARGS:-<full sync>}'"
          # Retry (upserts são idempotentes): protege de P1002 transitório.
          # shellcheck disable=SC2086
          for tentativa in 1 2 3; do
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-senado.ts $ARGS && break
            echo "sync falhou (tentativa $tentativa/3) — retry em 60s..."
              [ "$tentativa" = 3 ] && exit 1
              sleep 60
            done

      - name: Sync despesas CEAPS (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.apenas-despesas == 'true'
        env:
          INPUT_ANO: ${{ github.event.inputs.ano }}
        run: |
          ARGS=""
          [ -n "$INPUT_ANO" ] && ARGS="--ano=$INPUT_ANO"
          for tentativa in 1 2 3; do
            # shellcheck disable=SC2086
            npx ts-node --compiler-options '{"module":"CommonJS"}' scripts/sync-despesas-senado.ts --apenas-despesas $ARGS && break
            echo "sync despesas falhou (tentativa $tentativa/3) — retry em 60s..."
            [ "$tentativa" = 3 ] && exit 1
            sleep 60
          done

      - name: Coleta de lixo (retenção — janela de 3 anos)
        if: github.event_name == 'schedule'
        # Remove registros fora da janela de 3 anos (ver src/lib/gc.ts).
        # Idempotente: roda também na Câmara sem efeito colateral.
        run: npm run gc:apply

      - name: Log completion
        if: always()
        run: |
          echo "✅ Sync Senado concluído em $(date)"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run: ${{ github.run_id }}"
